name: Add LinkedIn Projects

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add projects
        env:
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/PortfolioShell.tsx')
          s = p.read_text()
          marker = 'Casting Design & Simulation of Thor’s Stormbreaker'
          if marker in s:
              raise SystemExit(0)
          insert = '''  { title: "Casting Design & Simulation of Thor’s Stormbreaker", category: "Manufacturing", tags: ["SolidWorks", "Altair Inspire Cast", "Casting", "Advanced Manufacturing"], description: "Designed and analyzed a detailed metal casting project for ME 8750: Advanced Manufacturing Processes at Clemson University using SolidWorks and Altair Inspire Cast. The project focused on optimizing casting design through simulation and analysis.", metric: "Advanced Manufacturing", sections: [{ title: "Project", body: "Detailed metal casting design and simulation project completed for ME 8750: Advanced Manufacturing Processes at Clemson University." }, { title: "Tools", body: "Used SolidWorks for casting design and Altair Inspire Cast for casting simulation and analysis." }, { title: "Focus", body: "Focused on casting design optimization through engineering simulation and analysis." }], highlights: ["SolidWorks", "Altair Inspire Cast", "Metal casting", "Casting simulation", "Design optimization"] },
  { title: "X-Ray Inspection Process Optimization – Aalberts Surface Technologies (RMF)", category: "Manufacturing", tags: ["Lean Six Sigma", "DMAIC", "Manufacturing Process Improvement", "X-Ray Inspection"], description: "Applied Lean Six Sigma (DMAIC) methodology to improve the X-ray inspection process for electroplated components at Aalberts Surface Technologies.", metric: "Process Improvement", sections: [{ title: "Project", body: "Process improvement project associated with Aalberts Surface Technologies, focused on the X-ray inspection process for electroplated components." }, { title: "Methodology", body: "Applied the Lean Six Sigma DMAIC methodology to structure the process improvement effort." }, { title: "Focus", body: "Focused on improving the X-ray inspection process used for electroplated components." }], highlights: ["Lean Six Sigma", "DMAIC", "X-ray inspection", "Electroplated components", "Process improvement"] },
'''
          needle = 'const projects: Project[] = [\n'
          if needle not in s:
              raise SystemExit('projects declaration not found')
          p.write_text(s.replace(needle, needle + insert, 1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/PortfolioShell.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: add LinkedIn projects'
          git push
