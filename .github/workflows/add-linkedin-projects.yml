name: Add LinkedIn Projects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-projects:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add LinkedIn projects
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/PortfolioShell.tsx')
          s = p.read_text()
          marker = 'Casting Design & Simulation of Thor’s Stormbreaker'
          if marker in s:
              raise SystemExit(0)
          insert = '''  { title: "Casting Design & Simulation of Thor’s Stormbreaker", category: "Manufacturing", tags: ["SolidWorks", "Altair Inspire Cast", "Casting", "Advanced Manufacturing"], description: "Designed and analyzed a detailed metal casting project for ME 8750: Advanced Manufacturing Processes at Clemson University using SolidWorks and Altair Inspire Cast, with a focus on casting design and optimization.", metric: "Advanced Manufacturing", sections: [{ title: "Project", body: "Detailed metal casting design and simulation project completed for ME 8750: Advanced Manufacturing Processes at Clemson University." }, { title: "Tools & analysis", body: "Used SolidWorks for casting design and Altair Inspire Cast for casting simulation and analysis." }, { title: "Focus", body: "The project focused on optimizing the casting design through engineering analysis and simulation." }], highlights: ["SolidWorks", "Altair Inspire Cast", "Metal casting", "Casting simulation", "Design optimization"] },
  { title: "X-Ray Inspection Process Optimization – Aalberts Surface Technologies (RMF)", category: "Manufacturing", tags: ["Lean Six Sigma", "DMAIC", "Manufacturing Process Improvement", "X-Ray Inspection"], description: "Applied Lean Six Sigma (DMAIC) methodology to improve the X-ray inspection process for electroplated components at Aalberts Surface Technologies.", metric: "Process Improvement", sections: [{ title: "Project", body: "Process improvement project associated with Aalberts Surface Technologies, focused on the X-ray inspection process for electroplated components." }, { title: "Methodology", body: "Applied the Lean Six Sigma DMAIC methodology to structure the process improvement effort." }, { title: "Focus", body: "The project focused on improving the X-ray inspection process used for electroplated components." }], highlights: ["Lean Six Sigma", "DMAIC", "X-ray inspection", "Electroplated components", "Process improvement"] },
'''
          needle = 'const projects: Project[] = [\n'
          if needle not in s:
              raise SystemExit('projects declaration not found')
          s = s.replace(needle, needle + insert, 1)
          p.write_text(s)
          PY
      - name: Commit project additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PortfolioShell.tsx
          git diff --cached --quiet || git commit -m "feat: add LinkedIn projects"
          git push
